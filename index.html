
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exam Paper</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 16px 24px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
        }

        h1 {
            margin: 0;
            font-size: 20px;
        }

        .download {
            padding: 10px 16px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            white-space: nowrap;
        }

        .download:hover {
            background: #1d4ed8;
        }

        main {
            padding: 16px;
        }

        iframe {
            display: block;
            width: 100%;
            height: calc(100vh - 115px);
            min-height: 400px;
            border: none;
            border-radius: 8px;
            background: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>Exam Paper</h1>

        <a
            class="download"
            href="exam.pdf"
            download="exam.pdf"
        >
            Download PDF
        </a>
    </header>

    <main>
        <iframe
            src="exam.pdf#toolbar=1&navpanes=0"
            title="Exam paper PDF viewer"
        ></iframe>
    </main>

</body>
</html>
